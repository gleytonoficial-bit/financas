  h += '<div class="grid">' + PF.panel('Faturas por cartão em ' + y, 'Em reais inteiros. Meses claros são projeção do que já está lançado. Clique numa célula para abrir o mês.', hd.rowsDef.length ? PF.heat(hd.rowsDef, hd.cols, hd.matrix, { selM: m, totLabel: hd.cols.some(c => c.proj) ? 'Total c/ proj.' : 'Total' }) : PF.empty('Sem dados em ' + y, '')) + '</div>';
  return { title: 'Cartões e faturas', sub: PF.labC(m) + ' · ' + F.length + ' faturas', html: h };
};

/* ============================================================
   PARCELAS
   ============================================================ */
V.parcelas = function (M) {
  const S = PF.S, m = S.m, T = PF.T;
  const pes = M.respList.filter(n => M.classOf(n) === 'Pessoal');
  let sc = S.parcScope || 'Pessoal';
  if (sc.indexOf('p:') === 0 && M.respList.indexOf(sc.slice(2)) < 0) sc = S.parcScope = 'Pessoal';
  const isP = sc.indexOf('p:') === 0, who = isP ? sc.slice(2) : null;
  const inSc = r => sc === 'Tudo' || (isP ? r.resp === who : r.classe === sc);
  const pesLabel = pes.length ? pes.join(' + ') : 'Casal';
  const scLabel = sc === 'Tudo' ? 'todos os responsáveis' : isP ? who : sc === 'Pessoal' ? pesLabel : (PF.CLASS_LABEL[sc] || sc);
  const parcOf = k => PF.active(M, k).filter(r => r.tipo === 'PARCELADO');
  const allM = parcOf(m), nextM = parcOf(m + 1);
  const all = allM.filter(inSc);
  const plans = all.map(r => ({ r, falta: r.val * (r.fim - m + 1), resta: r.fim - m }));
  const mensal = PF.sum(all), sd = PF.saldoDev(M, m, inSc), prox = PF.sum(nextM.filter(inSc));
  const ends3 = all.filter(r => r.fim <= m + 2), finite = all.filter(r => r.fim < 99999);
  const lastFim = finite.length ? Math.max.apply(null, finite.map(r => r.fim)) : null;
  const lastPlan = finite.filter(r => r.fim === lastFim)[0];

  const chip = (v, label, color) => '<button type="button" class="chip" data-act="pscope" data-v="' + esc(v) + '" aria-pressed="' + (v === sc) + '">' + (color ? '<i style="background:' + color + '"></i>' : '') + esc(label) + '</button>';
  const chips = '<div class="chips">' + [['Pessoal', pesLabel], ['Tudo', 'Todos'], ['Família', 'Família'], ['Negócio', 'Negócios']].map(o => chip(o[0], o[1])).join('') +
    '<span class="chip-sep" aria-hidden="true"></span>' + M.respList.map(n => chip('p:' + n, n, PF.respColor(M, n))).join('') + '</div>';
  let h = '<div class="panel" style="padding:14px 16px"><div class="muted" style="font-size:12px;margin-bottom:8px">Ver parcelas de</div>' + chips + '</div>';

  h += '<div class="kpis" style="margin-top:14px">' + [
    PF.kpi({ hero: 1, lab: 'Parcelas de ' + PF.lab(m), val: PF.money(mensal), note: all.length + (all.length === 1 ? ' plano ativo' : ' planos ativos') + ' · ' + scLabel }),
    PF.kpi({ lab: 'Saldo devedor', val: PF.money(sd), note: 'O que falta pagar, incluindo este mês' }),
    PF.kpi({ lab: 'Parcelas de ' + PF.lab(m + 1), val: PF.money(prox), note: prox < mensal ? PF.brl(mensal - prox) + ' a menos que este mês' : prox > mensal ? PF.brl(prox - mensal) + ' a mais que este mês' : 'Igual a este mês' }),
    PF.kpi({ lab: 'Quita tudo em', val: lastFim != null ? '<span style="font-size:.85em">' + PF.lab(lastFim) + '</span>' : '<span class="muted">—</span>', note: (lastPlan ? 'Última: ' + esc(lastPlan.desc) + ' · ' + esc(lastPlan.resp) : 'Sem parcelas ativas') + (ends3.length ? ' · ' + PF.brl(PF.sum(ends3)) + ' terminam até ' + PF.lab(m + 2) : '') })
  ].join('') + '</div>';

  /* resumo por responsável: todos aparecem, o filtro fica destacado */
  const line = (label, pred, key) => {
    const a = allM.filter(pred), f = a.filter(r => r.fim < 99999);
    return { label, key, n: a.length, mes: PF.sum(a), prox: PF.sum(nextM.filter(pred)), sd: PF.saldoDev(M, m, pred), fim: f.length ? Math.max.apply(null, f.map(r => r.fim)) : null };
  };
  const rowsP = pes.map(n => line(n, r => r.resp === n, 'p:' + n));
  const rowsO = M.respList.filter(n => pes.indexOf(n) < 0).map(n => line(n, r => r.resp === n, 'p:' + n));
  const sub = line(pesLabel, r => r.classe === 'Pessoal', 'Pessoal'); sub.sub = true;
  const tot = line('Total', () => true, 'Tudo');
  const R = rowsP.concat(pes.length ? [sub] : [], rowsO);
  const on = l => l.key === sc || (!isP && sc !== 'Tudo' && !l.sub && M.classOf(l.label) === sc);
  const nm = l => '<button type="button" class="lnk" data-act="pscope" data-v="' + esc(l.key) + '">' + (l.sub ? '' : '<i class="dot" style="background:' + PF.respColor(M, l.label) + '"></i>') + esc(l.label) + '</button>';
  const mz = v => Math.abs(v) < 0.005 ? '<span class="muted">–</span>' : PF.money(v);
  const resumo = PF.tbl([
    { h: 'Responsável', f: nm, cls: 'nw' },
    { h: 'Planos', f: l => l.n ? String(l.n) : '<span class="muted">–</span>', cls: 'r' },
    { h: 'Parcelas de ' + PF.lab(m), f: l => mz(l.mes), cls: 'r' },
    { h: PF.lab(m + 1), f: l => mz(l.prox), cls: 'r' },
    { h: 'Saldo devedor', f: l => mz(l.sd), cls: 'r' },
    { h: '% do saldo', f: l => tot.sd && l.sd > 0.005 ? PF.pct(l.sd / tot.sd, 0) : '–', cls: 'r muted' },
    { h: 'Quita tudo em', f: l => l.fim != null ? PF.lab(l.fim) : '<span class="muted">—</span>', cls: 'nw' }
  ], R, { rowCls: l => [l.sub ? 'sub' : '', on(l) ? 'on' : ''].join(' ').trim(), foot: '<tr class="tot' + (sc === 'Tudo' ? ' on' : '') + '"><td>Total</td><td class="r">' + tot.n + '</td><td class="r">' + PF.money(tot.mes) + '</td><td class="r">' + PF.money(tot.prox) + '</td><td class="r">' + PF.money(tot.sd) + '</td><td class="r muted">100%</td><td class="nw">' + (tot.fim != null ? PF.lab(tot.fim) : '—') + '</td></tr>' });
  h += '<div class="grid">' + PF.panel('Parcelas por responsável', 'Todos aparecem para comparar; em azul, quem está no filtro. Clique num nome para filtrar.', resumo) + '</div>';

  const N = 24, months = PF.range(m, m + N - 1);
  h += '<div class="grid">' + PF.panel('Quanto pesa o parcelado nos próximos ' + N + ' meses · ' + scLabel, 'Só o que já está lançado: nenhuma compra nova entra na conta. A queda mostra quando o orçamento folga.', '<div class="chart"><canvas id="chProj" role="img" aria-label="Projeção das parcelas por mês"></canvas></div>') + '</div>';

  const st = S.sort.parc || { k: 'falta', d: -1 };
  const sorted = PF.sortRows(plans, st, { desc: p => p.r.desc, resp: p => p.r.resp, card: p => p.r.card, val: p => p.r.val, falta: p => p.falta, fim: p => p.r.fim, cat: p => p.r.cat });
  const body = sorted.length ? PF.tbl([
    { h: 'Descrição', f: p => '<span title="' + esc(p.r.desc) + '">' + esc(p.r.desc) + '</span>', cls: 'ds', sort: 'desc' },
    { h: 'Responsável', f: p => '<i class="dot" style="background:' + PF.respColor(M, p.r.resp) + '"></i>' + esc(p.r.resp), cls: 'nw', sort: 'resp' },
    { h: 'Cartão', f: p => esc(p.r.card), cls: 'nw', sort: 'card' },
    { h: 'Parcela', f: p => esc(PF.parcelaTxt(p.r, m, 1)), cls: 'c nw num' },
    { h: 'Valor', f: p => PF.money(p.r.val), cls: 'r', sort: 'val' },
    { h: 'Falta pagar', f: p => PF.money(p.falta), cls: 'r', sort: 'falta' },
    { h: 'Termina em', f: p => PF.lab(p.r.fim) + (p.resta === 0 ? ' <span class="pill good">última</span>' : ''), cls: 'nw', sort: 'fim' },
    { h: 'Categoria', f: p => esc(p.r.cat), cls: 'nw muted', sort: 'cat' },
    { h: '', f: p => PF.rowLink(PF.GID.led, p.r.row, ''), cls: 'nw' }
  ], sorted, { id: 'parcTbl', sort: st, foot: '<tr class="tot"><td colspan="4">Total (' + sorted.length + ' planos)</td><td class="r">' + PF.money(PF.sum(sorted, p => p.r.val)) + '</td><td class="r">' + PF.money(PF.sum(sorted, p => p.falta)) + '</td><td colspan="3"></td></tr>' }) : PF.empty('Sem parcelas neste filtro', 'Nenhum plano ativo de ' + scLabel + ' em ' + PF.lab(m) + '.');
  h += '<div class="grid">' + PF.panel('Planos ativos · ' + scLabel, 'Ordene pelo cabeçalho. "Falta pagar" inclui a parcela do mês.', body) + '</div>';

  return {
    title: 'Parcelas', sub: all.length + ' planos ativos em ' + PF.lab(m) + ' · ' + scLabel + ' · saldo devedor ' + PF.brl(sd), html: h,
    after: () => {
      const proj = (k, pred) => PF.sum(parcOf(k).filter(pred));
      const names = sc === 'Tudo' ? null : isP ? [who] : M.respList.filter(n => M.classOf(n) === sc);
      const ds = names
        ? names.map(n => ({ type: 'bar', label: n, data: months.map(k => proj(k, r => r.resp === n)), backgroundColor: PF.alpha(PF.respColor(M, n), .85), stack: 'p', borderRadius: 2, maxBarThickness: 30 }))
        : PF.CLASSES.map(cl => ({ type: 'bar', label: PF.CLASS_LABEL[cl], data: months.map(k => proj(k, r => r.classe === cl)), backgroundColor: PF.alpha(PF.clsColor(cl), .85), stack: 'p', borderRadius: 2, maxBarThickness: 30 }));
      PF.mkChart('chProj', {
        data: { labels: months.map(k => PF.lab(k)), datasets: ds },
        options: { scales: { x: { stacked: true, ticks: { autoSkip: true, maxTicksLimit: 12 } }, y: { stacked: true, beginAtZero: true } }, onClick: (e, els) => { if (els && els.length) PF.setMonth(months[els[0].index]); }, plugins: { tooltip: { callbacks: { footer: it => 'Total: ' + PF.brl(it.reduce((s, i) => s + i.parsed.y, 0)) } } } }
      });
    }
  };
};

/* ============================================================
   A RECEBER
   Família: quem usa os seus cartões (você lança no nome da pessoa, filtra e cobra).
   Negócios: custos que você adiantou e recupera da receita de cada negócio.
   ============================================================ */
V.receber = function (M) {
  const S = PF.S, m = S.m, T = PF.T, y = PF.yOf(m);
  const people = M.respList.filter(n => (M.respMap.get(n) || {}).reemb);
  if (!people.length) return { title: 'A receber', sub: '', html: '<div class="panel">' + PF.empty('Ninguém reembolsa o casal', 'Em CADASTROS, marque Sim na coluna REEMBOLSA O CASAL? para quem usa os seus cartões e para os negócios.') + '</div>' };
  const L = people.map(n => Object.assign({ n, cls: M.classOf(n) }, PF.receberLinha(M, n, m)));
  const byS = (a, b) => b.saldo - a.saldo;
  const fam = L.filter(l => l.cls !== 'Negócio').sort(byS), neg = L.filter(l => l.cls === 'Negócio').sort(byS);
  const sum = (arr, f) => PF.sum(arr, f);
  const totSaldo = sum(L, l => l.saldo), famSaldo = sum(fam, l => l.saldo), negSaldo = sum(neg, l => l.saldo), totRcb = sum(L, l => l.rcbMes);
  const names = arr => arr.map(l => l.n).join(', ');
  let h = '<div class="kpis">' + [
    PF.kpi({ hero: 1, lab: 'Total a receber', val: PF.money(totSaldo), note: 'Desde ' + PF.lab(M.minIdx) + ', já descontados os reembolsos lançados' }),
    PF.kpi({ lab: 'Da família', val: PF.money(famSaldo), note: fam.length ? names(fam) + ' usam os seus cartões' : 'Ninguém cadastrado' }),
    PF.kpi({ lab: 'Dos negócios', val: PF.money(negSaldo), note: neg.length ? 'Custos de ' + names(neg) + ' que você adiantou' : 'Nenhum negócio cadastrado' }),
    PF.kpi({ lab: 'Recebido neste mês', val: PF.money(totRcb), note: totRcb ? 'Reembolsos lançados em RECEITAS' : 'Nenhum reembolso lançado em ' + PF.lab(m) })
  ].join('') + '</div>';

  const mk = (arr, saldoLab) => PF.tbl([
    { h: 'Responsável', f: l => '<i class="dot" style="background:' + PF.respColor(M, l.n) + '"></i><b>' + esc(l.n) + '</b>', cls: 'nw' },
    { h: 'Devido no mês', f: l => PF.money(l.devMes), cls: 'r hm' },
    { h: 'Recebido no mês', f: l => PF.money(l.rcbMes), cls: 'r hm' },
    { h: 'Devido acumulado', f: l => PF.money(l.dev), cls: 'r hm' },
    { h: 'Recebido acumulado', f: l => PF.money(l.rcb), cls: 'r hm' },
    { h: saldoLab, f: l => '<b>' + PF.money(l.saldo) + '</b>', cls: 'r' },
    { h: '', f: l => '<span class="rb-acts">' + (PF.rbBtn ? PF.rbBtn(M, l.n, l.saldo) : '') + '<button type="button" class="btn sm" data-act="statement" data-v="' + esc(l.n) + '">Extrato</button></span>', cls: 'nw' }
  ], arr, { foot: '<tr class="tot"><td>Total</td><td class="r hm">' + PF.money(sum(arr, l => l.devMes)) + '</td><td class="r hm">' + PF.money(sum(arr, l => l.rcbMes)) + '</td><td class="r hm">' + PF.money(sum(arr, l => l.dev)) + '</td><td class="r hm">' + PF.money(sum(arr, l => l.rcb)) + '</td><td class="r">' + PF.money(sum(arr, l => l.saldo)) + '</td><td></td></tr>' });
  if (fam.length) h += '<div class="grid">' + PF.panel('Família: gastos nos seus cartões', 'Você lança a despesa no nome de cada um e cobra o valor. "Devido" é o que foi lançado no nome da pessoa; "Recebido" são as linhas de RECEITAS com tipo Reembolso recebido.', mk(fam, 'A receber'), { hint: 'Para mandar a cobrança, clique em Extrato: o texto sai pronto para colar no WhatsApp. Quando a pessoa pagar, clique em Recebi: o painel grava a baixa em RECEITAS e o saldo dela diminui. Recebeu só uma parte? Troque o valor na hora de confirmar.' }) + (PF.rbForm ? PF.rbForm(M, null, 'fam') : '') + '</div>';
  if (neg.length) h += '<div class="grid">' + PF.panel('Negócios: custos que você adiantou', 'Gastos que entraram nos seus cartões em nome de cada negócio. O que o negócio devolve sai da receita dele; o que sobra é o lucro líquido (veja a aba Negócios).', mk(neg, 'A recuperar'), { hint: 'Quando o negócio repassar o valor, clique em Recebi: o painel grava a baixa em RECEITAS e o que falta repor diminui.' }) + (PF.rbForm ? PF.rbForm(M, null, 'neg') : '') + '</div>';
  h += '<div class="grid">' + PF.panel('Saldo a receber ao longo de ' + y, 'Acumulado por pessoa e negócio, só meses realizados.', '<div class="chart"><canvas id="chRec" role="img" aria-label="Saldo a receber por pessoa e negócio"></canvas></div>') + '</div>';
  return {
    title: 'A receber', sub: people.length + ' pessoas e negócios com gastos nos seus cartões · ' + PF.labC(m), html: h,
    after: () => {
      const last = Math.min(y * 12 + 11, Math.max(m, M.maxIni != null ? M.maxIni : m)), first = Math.max(y * 12, M.minIdx != null ? M.minIdx : y * 12);
      if (last < first) return;
      const months = PF.range(first, last);
      const ds = people.map(n => { const ser = PF.receberSerie(M, n, last), mp = new Map(ser.map(s => [s.m, s.saldo])); return { type: 'bar', label: n, data: months.map(k => mp.get(k) || 0), backgroundColor: PF.respColor(M, n), stack: 'r', borderRadius: 2, maxBarThickness: 40 }; });
      PF.mkChart('chRec', {
        data: { labels: months.map(monthShort), datasets: ds },
        options: { scales: { x: { stacked: true }, y: { stacked: true, beginAtZero: true } }, plugins: { tooltip: { callbacks: { footer: it => 'Total: ' + PF.brl(it.reduce((s, i) => s + i.parsed.y, 0)) } } }, onClick: (e, els) => { if (els && els.length) PF.setMonth(months[els[0].index]); } }
      });
    }
  };
};

/* ============================================================
   NEGÓCIOS
   Receita bruta - gastos do mês = lucro líquido (o que sobra para você).
   ============================================================ */
function dre(M, k, units) {
  const rows = PF.gasto(M, k).filter(r => units.indexOf(r.resp) >= 0);
  const rec = PF.sum(PF.recAt(M, k, ['Receita do negócio']).filter(x => units.indexOf(x.resp) >= 0), x => x.val);
  const by = t => PF.sum(rows.filter(r => r.tipo === t)), cost = PF.sum(rows);
  return { rec, cost, parc: by('PARCELADO'), fix: by('FIXO'), vr: by('VARIÁVEL'), res: rec - cost, mg: rec > 0 ? (rec - cost) / rec : null };
}
V.negocios = function (M) {
  const S = PF.S, m = S.m, T = PF.T, y = PF.yOf(m);
  const units = M.respList.filter(n => M.classOf(n) === 'Negócio');
  if (!units.length) return { title: 'Negócios', sub: '', html: '<div class="panel">' + PF.empty('Nenhum negócio cadastrado', 'Em CADASTROS, use a classe Negócio para cada unidade de negócio.') + '</div>' };
  if (S.unit !== 'Todas' && units.indexOf(S.unit) < 0) S.unit = 'Todas';
  const sel = S.unit === 'Todas' ? units : [S.unit];
  const D = dre(M, m, sel), Dp = dre(M, m - 1, sel);
  const hasPrev = Dp.cost > 0 || Dp.rec > 0;
  const chips = '<div class="chips">' + ['Todas'].concat(units).map(n => '<button type="button" class="chip" data-act="unit" data-v="' + esc(n) + '" aria-pressed="' + (n === S.unit) + '">' + (n === 'Todas' ? '' : '<i style="background:' + PF.respColor(M, n) + '"></i>') + esc(n === 'Todas' ? 'Todos os negócios' : n) + '</button>').join('') + '</div>';
  let h = '<div class="panel" style="padding:14px 16px">' + chips + '</div>';
  h += '<div class="kpis" style="margin-top:14px">' + [
    PF.kpi({ hero: 1, lab: 'Lucro líquido do mês', val: PF.money(D.res), tone: D.res < 0 ? 'neg' : 'pos', note: 'Receita bruta menos os gastos do mês', delta: hasPrev ? PF.delta(D.res, Dp.res, 'good') : '' }),
    PF.kpi({ lab: 'Receita bruta', val: PF.money(D.rec), note: D.rec ? 'Tipo Receita do negócio em RECEITAS' : 'Nenhuma receita lançada em ' + PF.lab(m), delta: hasPrev ? PF.delta(D.rec, Dp.rec, 'good') : '' }),
    PF.kpi({ lab: 'Gastos do mês', val: PF.money(D.cost), note: 'Parcelas ' + PF.brl(D.parc) + ' · fixos ' + PF.brl(D.fix) + ' · variáveis ' + PF.brl(D.vr), delta: hasPrev ? PF.delta(D.cost, Dp.cost, 'bad') : '' }),
    PF.kpi({ lab: 'Margem líquida', val: D.mg == null ? '<span class="muted">—</span>' : PF.pct(D.mg, 0), note: D.mg == null ? 'Precisa de receita para calcular' : 'Lucro líquido sobre a receita bruta' })
  ].join('') + '</div>';

  const pending = PF.saldoDev(M, m, r => sel.indexOf(r.resp) >= 0);
  const fr = [
    { k: 'Receita bruta', v: D.rec, cls: '' },
    { k: '(−) Parcelas do mês', v: D.parc, cls: 'ind' }, { k: '(−) Gastos fixos', v: D.fix, cls: 'ind' }, { k: '(−) Gastos variáveis', v: D.vr, cls: 'ind' },
    { k: 'Gastos do mês', v: D.cost, cls: 'sub' }
  ];
  const fech = PF.tbl([
    { h: 'Item', f: r => r.cls === 'ind' ? '<span style="padding-left:14px" class="muted">' + esc(r.k) + '</span>' : esc(r.k), cls: 'nw' },
    { h: 'Valor', f: r => PF.money(r.v), cls: 'r' }
  ], fr, { rowCls: r => r.cls === 'sub' ? 'sub' : '', foot: '<tr class="tot"><td>Lucro líquido (o que sobra)</td><td class="r">' + PF.money(D.res) + '</td></tr>' });
  const cats = PF.groupSum(PF.gasto(M, m).filter(r => sel.indexOf(r.resp) >= 0), r => r.cat).map(([k, v]) => ({ key: k, label: k, value: v, color: /classificar/i.test(k) ? T.warn : T.cls['Negócio'] }));
  h += '<div class="grid gw">' + PF.panel('Fechamento do mês', (S.unit === 'Todas' ? 'Todos os negócios' : S.unit) + ' · ' + PF.labC(m), fech, { hint: 'Compras parceladas ainda a pagar (incluindo este mês): ' + PF.brl(pending) + '.' }) +
    PF.panel('Gastos por categoria', (S.unit === 'Todas' ? 'Todos os negócios' : S.unit) + ' · ' + PF.lab(m), PF.bars(cats, { totalRow: 1 })) + '</div>';

  if (units.length > 1) {
    const per = units.map(n => Object.assign({ n, pend: PF.saldoDev(M, m, r => r.resp === n) }, dre(M, m, [n])));
    const T0 = dre(M, m, units);
    const H2 = (lg, sm) => '<span class="lg">' + lg + '</span><span class="sm">' + sm + '</span>';
    const dtbl = PF.tbl([
      { h: 'Negócio', f: u => '<span class="nmw"><i class="dot" style="background:' + PF.respColor(M, u.n) + '"></i><b>' + esc(u.n) + '</b></span>', cls: '' },
      { h: H2('Receita bruta', 'Receita'), f: u => PF.money(u.rec), cls: 'r' }, { h: H2('(−) Gastos do mês', 'Gastos'), f: u => PF.money(u.cost), cls: 'r' },

  const anyRec = Y.some(d => d.rec > 0);

            { type: 'bar', label: 'Gastos do mês', data: Y.map(d => d.cost), backgroundColor: months.map(k => PF.alpha(T.warn, PF.isProj(M, k) ? .3 : .9)), borderRadius: 2, maxBarThickness: 22, order: 2 },
            { type: 'line', label: 'Lucro líquido', data: Y.map((d, i) => (M.firstIdx != null && months[i] < M.firstIdx) ? null : d.res), spanGaps: false, borderColor: T.ink, backgroundColor: T.ink, borderWidth: 2, pointRadius: 3, tension: .25, order: 1 }
          ]

/* ============================================================
   LANÇAR: lançamento rápido, gravado direto na aba LANÇAMENTOS.
   Compra: valor, tipo, quem, cartão, descrição e categoria.
   Contas do mês: água, energia e outras contas que mudam de valor,
   montadas a partir do mês anterior; só troca os valores.
   ============================================================ */
(function () {
'use strict';
const PF = window.PF, esc = PF.esc, V = PF.V, S = PF.S;
const READ = 'get_values', WRITE = 'update_values', MAXROW = 2999, LS = 'pf2026-lanc';
const LED_A1 = r1 => "'LANÇAMENTOS'!A" + r1;

const L = PF.L = {
  mode: 'compra',
  f: { val: '', tipo: 'VARIÁVEL', parc: '', pa: '1', resp: '', card: '', desc: '', cat: '', catAuto: false, date: '', mesFat: '', obs: '' },
  more: false, contas: {}, cMes: null, busy: false, msg: null, last: null,
  x: { val: '', desc: '', resp: '', conta: 'brad', date: '' }, xlast: null,
  cxBusy: null, cxForm: null, cxMsg: null, cxAll: false, cxDone: null, cxQuiet: false
};
const META_EXTRA = 1000;   // renda extra prevista no plano do casal
try { const o = JSON.parse(localStorage.getItem(LS) || '{}'); if (o.resp) L.f.resp = o.resp; if (o.card) L.f.card = o.card; if (o.xresp) L.x.resp = o.xresp; if (o.xconta) L.x.conta = o.xconta; } catch (e) { }
function savePrefs() { try { localStorage.setItem(LS, JSON.stringify({ resp: L.f.resp, card: L.f.card, xresp: L.x.resp, xconta: L.x.conta })); } catch (e) { } }

/* ---------- datas ---------- */
const pad = n => String(n).padStart(2, '0');
const isoToday = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const isoToBR = s => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ''); return m ? m[3] + '/' + m[2] + '/' + m[1] : ''; };
const firstBR = k => '01/' + pad(PF.moOf(k) + 1) + '/' + PF.yOf(k);
const idxOfIso = s => { const m = /^(\d{4})-(\d{2})/.exec(s || ''); return m ? (+m[1]) * 12 + (+m[2]) - 1 : null; };
const dayOfIso = s => { const m = /-(\d{2})$/.exec(s || ''); return m ? +m[1] : null; };
const valOf = s => { const v = PF.pNum(s); return v == null ? null : Math.round(v * 100) / 100; };
const nf2 = new Intl.NumberFormat('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

/* mês da fatura pela mesma regra da coluna MÊS DE REFERÊNCIA da planilha */
function refMonth(card, iso) {
  const k = idxOfIso(iso), d = dayOfIso(iso);
  if (k == null) return null;
  const fe = card && card.fecha ? +card.fecha : 0, ve = card && card.venc ? +card.venc : 0;
  return k + (fe > 0 ? ((d > fe ? 1 : 0) + (ve > 0 && ve <= fe ? 1 : 0)) : 0);
}

/* ---------- listas a partir da planilha ---------- */
function lists(M) {
  const now = PF.nowIdx();
  const cards = M.cad.cards.filter(c => c.ativo);
  const use = new Map();
  for (const r of M.led) if (r.card) use.set(r.card, (use.get(r.card) || 0) + (r.ini != null && r.ini >= now - 3 ? 3 : 1));
  const byUse = cards.slice().sort((a, b) => (use.get(b.name) || 0) - (use.get(a.name) || 0) || a.name.localeCompare(b.name, 'pt-BR'));
  const hist = new Map(), descs = [];
  M.led.slice().sort((a, b) => b.row - a.row).forEach(r => {
    const k = PF.norm(r.desc); if (!k || k === 'A DESCREVER') return;
    if (!hist.has(k)) { hist.set(k, r); descs.push(r.desc); }
  });
  const groups = new Map();
  for (const c of M.cad.cats) { const g = c.grupo || 'Outros'; if (!groups.has(g)) groups.set(g, []); groups.get(g).push(c.name); }
  return { cards, top: byUse.slice(0, 6), hist, descs: descs.slice(0, 250), groups };
}

/* ---------- contas do mês ---------- */
const keyOf = r => PF.norm(r.desc) + '|' + PF.norm(r.resp) + '|' + PF.norm(r.card);
const isVar = r => r.tipo === 'FIXO' && PF.norm(r.repete) !== 'TODO MES';
function contas(M, T) {
  let base = [], bm = null;
  for (let k = T - 1; k >= T - 3 && !base.length; k--) { base = M.led.filter(r => isVar(r) && r.ini === k); bm = k; }
  const seen = new Set(), tpl = [];
  for (const r of base) {
    const k = keyOf(r); if (seen.has(k)) continue; seen.add(k);
    const ex = M.led.filter(x => x.ini === T && keyOf(x) === k);
    tpl.push({ k, desc: r.desc, resp: r.resp, card: r.card, cat: r.cat || 'A classificar', last: r.val, done: ex.length ? PF.sum(ex) : null });
  }
  const auto = M.led.filter(r => r.tipo === 'FIXO' && PF.norm(r.repete) === 'TODO MES' && r.ini != null && r.ini <= T && r.fim >= T);
  return { tpl, bm: base.length ? bm : null, auto };
}

/* ---------- tela ---------- */
const chip = (act, v, label, on, color) => '<button type="button" class="chip" data-act="' + act + '" data-v="' + esc(v) + '" aria-pressed="' + (!!on) + '">' + (color ? '<i style="background:' + color + '"></i>' : '') + esc(label) + '</button>';
function msgBox() {
  const m = L.msg; if (!m) return '';
  return '<div class="lf-msg ' + m.t + '" role="' + (m.t === 'bad' ? 'alert' : 'status') + '"><span>' + m.h + '</span>' + (m.undo && L.last ? '<button type="button" class="btn sm" data-act="l-undo"' + (L.busy ? ' disabled' : '') + '>Desfazer</button>' : '') + (m.xundo && L.xlast ? '<button type="button" class="btn sm" data-act="l-xundo"' + (L.busy ? ' disabled' : '') + '>Desfazer</button>' : '') + '</div>';
}
function liveNote() {
  if (PF.mode === 'live' && PF.mcp) return '';
  return '<div class="lf-msg warn"><span>' + (PF.mode === 'demo' ? 'Você está vendo dados de exemplo. Para gravar, o painel precisa estar ligado à planilha.' : 'Aguardando a planilha para poder gravar.') + '</span></div>';
}
function goLabel() {
  const f = L.f, v = valOf(f.val);
  if (L.busy) return 'Gravando…';
  if (v == null || v <= 0) return 'Lançar';
  if (f.tipo === 'PARCELADO') { const n = parseInt(f.parc, 10); return n > 1 ? 'Lançar ' + n + 'x de ' + PF.brl(v) : 'Lançar parcela de ' + PF.brl(v); }
  return 'Lançar ' + PF.brl(v) + (f.tipo === 'FIXO' ? ' por mês' : '');
}
function totalHelp() {
  const f = L.f, v = valOf(f.val), n = parseInt(f.parc, 10);
  if (f.tipo === 'PARCELADO') return v && n > 1 ? 'Total da compra: ' + PF.brl(v * n) + '. Digite o valor de uma parcela.' : 'Digite o valor de uma parcela e o número de parcelas.';
  if (f.tipo === 'FIXO') return 'Repete todo mês sozinho, sem data para acabar. Para conta que muda de valor (água, energia), use Contas do mês.';
  return '';
}
function fatHelp(M) {
  const f = L.f, c = M.cardMap.get(f.card), iso = f.date || isoToday();
  if (f.mesFat) return 'Entra na fatura de ' + PF.lab(+f.mesFat) + ' (escolhido à mão).' + (PF.closedInfo && PF.closedInfo(M, +f.mesFat) ? ' <b style="color:var(--warn)">Atenção: ' + PF.lab(+f.mesFat) + ' já foi finalizado.</b>' : '');
  if (!c) return '';
  const k = refMonth(c, iso);
  const fin = PF.closedInfo && PF.closedInfo(M, k) ? ' <b style="color:var(--warn)">Atenção: ' + PF.lab(k) + ' já foi finalizado.</b>' : '';
  if (/CREDITO/.test(PF.norm(c.tipo))) return (c.fecha ? 'Entra na fatura de ' + PF.lab(k) + ' (o ' + esc(c.name) + ' fecha dia ' + c.fecha + ').' : 'Entra no mês da compra: o ' + esc(c.name) + ' está sem dia de fechamento em CADASTROS.') + fin;
  return 'Entra no mês de ' + PF.lab(k) + '.' + fin;
}

function formCompra(M, X) {
  const f = L.f, now = PF.nowIdx();

    '<div class="lf-field">' + PF.seg('l-tipo', [['VARIÁVEL', 'À vista'], ['PARCELADO', 'Parcelado'], ['FIXO', 'Fixo todo mês']], f.tipo) + (th ? '<p class="lf-help" id="lf-total">' + th + '</p>' : '') + '</div>' +
    parc +
    '<div class="lf-field"><span class="lf-lab">Quem gastou</span><div class="chips">' + M.respList.map(n => chip('l-resp', n, PF.nome(n), n === f.resp, PF.respColor(M, n))).join('') + '</div></div>' +
    '<div class="lf-field"><span class="lf-lab">Cartão ou conta</span><div class="chips">' + cardChips + more + '</div><p class="lf-help" id="lf-fat">' + fatHelp(M) + '</p></div>' +

    '<div class="lf-field"><label class="lf-lab" for="lf-cat">Categoria</label><select id="lf-cat">' + cats + '</select>' + (f.catAuto && f.cat ? '<p class="lf-help">Sugerida pelo histórico dessa descrição.</p>' : '') + '</div>' +
    '<details class="lf-more" id="lf-more"' + (L.more ? ' open' : '') + '><summary>Data, mês da fatura e observação</summary><div class="lf-2"><label class="lf-field"><span class="lf-lab">Data da compra</span><input id="lf-date" type="date" value="' + esc(f.date || isoToday()) + '"></label><label class="lf-field"><span class="lf-lab">Mês da fatura</span>' + mf + '</label></div><label class="lf-field"><span class="lf-lab">Observação</span><input id="lf-obs" autocomplete="off" value="' + esc(f.obs) + '"></label></details>' +

function formContas(M) {
  const now = PF.nowIdx(), T = L.cMes != null ? L.cMes : now, C = contas(M, T);
  let h = '<div class="lf-field"><span class="lf-lab">Mês das contas</span>' + PF.seg('l-cmes', [now - 1, now, now + 1].map(k => [String(k), PF.lab(k)]), String(T)) + '</div>';

  } else {
    let tot = 0, n = 0;
    h += '<div class="lc-list">' + C.tpl.map((t, i) => {

/* ---------- compras novas: notificações do banco (aba CAIXA DE ENTRADA) ---------- */

const cxGroup = row => PF.cxGroups(PF.M).find(g => g.main.row === row);
function cxWhen(d) {
  if (!d) return '';
  const now = new Date(), hm = pad(d.getHours()) + ':' + pad(d.getMinutes());
  const same = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
  if (same(d, now)) return 'hoje, ' + hm;
  const y = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 1);
  return same(d, y) ? 'ontem, ' + hm : pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + ', ' + hm;
}
function cxObs(it) {
  const d = it.at;
  return ['Notificação ' + (it.app || 'do banco'), it.p.final ? 'final ' + it.p.final : '', it.p.estab, d ? pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) : ''].filter(Boolean).join(' · ');
}
/* o que já foi lançado a partir de notificações ensina: final do cartão → cartão; loja → descrição, quem e categoria */
function cxLearn(M) {
  if (M._cxL) return M._cxL;
  const fin = new Map(), est = new Map();
  M.led.slice().sort((a, b) => a.row - b.row).forEach(r => {
    const o = String(r.obs || ''); if (!/^notifica/i.test(o)) return;
    const parts = o.split(' · ').map(x => x.trim());
    const f = parts.map(x => /^final (\d{4})$/i.exec(x)).find(Boolean);
    if (f && r.card) fin.set(f[1], r.card);
    const e = parts.slice(1).find(x => !/^final \d{4}$/i.test(x) && !/^\d{1,2}\/\d{1,2}\b/.test(x));
    if (e) est.set(PF.norm(e), r);

  return (M._cxL = { fin, est });
}
function cxCard(M, it, h) {
  const p = it.p, cards = M.cad.cards.filter(c => c.ativo);
  const pixCard = cards.find(c => /\bPIX\b|\bDEBITO\b/.test(PF.norm(c.name)));
  if (['debito', 'pix', 'boleto'].indexOf(p.tipo) >= 0 && pixCard) return pixCard.name;
  const L2 = cxLearn(M);
  if (p.final && L2.fin.has(p.final) && M.cardMap.has(L2.fin.get(p.final))) return L2.fin.get(p.final);
  const bank = PF.norm(p.wallet && p.cardDesc ? p.cardDesc : it.app + ' ' + it.titulo), b = BANKS.find(k => hasWord(bank, k[0]));
  if (b) {
    const cand = cards.filter(c => hasWord(PF.norm(c.name), b[1]));
    if (cand.length > 1 && it.cel) { const who = PF.norm(it.cel), mine = cand.filter(c => PF.norm(c.titular) === who); if (mine.length) return mine[0].name; }
    if (cand.length) return cand[0].name;

function cxSuggest(M, it) {

  if (!h && est) {

    let best = null;
    for (const r of M.led) {
      const d = PF.norm(r.desc); if (!d || d === 'A DESCREVER' || d.length < 3) continue;
      const hit = d === est || (d.length >= 5 && est.indexOf(d) >= 0) || (d.length >= 3 && !CX_STOP.test(d) && hasWord(est, d)) || words.some(w => hasWord(d, w));
      if (hit && (!best || r.row > best.row)) best = r;

  const s = { desc: h ? h.desc : (p.estab ? titleCase(p.estab) : ''), resp: h && h.resp && M.respList.indexOf(h.resp) >= 0 ? h.resp : '', cat: h && h.cat && PF.norm(h.cat) !== 'A CLASSIFICAR' ? h.cat : '', card: cxCard(M, it, h), how };
  s.ok = !!(p.val > 0 && !p.foreign && !(p.parc > 1) && s.resp && s.card && M.cardMap.has(s.card) && ['compra', 'debito', 'pix', 'boleto'].indexOf(p.tipo) >= 0);

const cxBtn = (act, v, label, cls) => '<button type="button" class="btn sm' + (cls ? ' ' + cls : '') + '" data-act="' + act + '" data-v="' + v + '"' + (L.busy || L.cxBusy ? ' disabled' : '') + '>' + esc(label) + '</button>';

/* marca na aba CAIXA DE ENTRADA; os avisos repetidos da mesma compra ficam como "duplicada" */
async function cxMark(rows, sit, info) {

    const r = rows[i], s = i > 0 && sit === 'lançado' ? 'duplicada' : sit, inf = i === 0 ? (info || '') : (sit === 'lançado' ? 'mesma compra: ' + info : '');

}

/* ---------- gravação ---------- */
function payloadOf(res) {
  let p = res && res.payload;
  if (typeof p === 'string') { try { p = JSON.parse(p); } catch (e) { p = null; } }
  if ((!p || typeof p !== 'object') && res && Array.isArray(res.content)) {
    const t = res.content.find(c => c && c.type === 'text');
    if (t) { try { p = JSON.parse(t.text); } catch (e) { p = null; } }
  }
  return p && typeof p === 'object' ? p : null;
}
async function nextRow() {

  if (!p || (p.values != null && !Array.isArray(p.values))) throw { code: 'bad_payload' };
  const vals = p.values || [];
  let last = 0;
  vals.forEach((r, i) => { if (Array.isArray(r) && r.some(c => String(c == null ? '' : c).trim() !== '')) last = i; });
  return last + 2;
}

function refresh() { if (PF.mcp) Promise.resolve(PF.mcp.invalidate(PF.SERVER, READ)).catch(() => { }); }
async function write(rows, done) {

  try {

    if (lastRow > MAXROW) throw { code: 'full' };
    const range = LED_A1(first) + ':M' + lastRow;
    const res = await PF.mcp.callTool(PF.SERVER, WRITE, { spreadsheetId: PF.SHEET_ID, range, values: rows });
    wrote = true;
    L.last = { first, n: rows.length, rows };
    L.msg = { t: 'good', h: rows.length === 1 ? 'Lançado na planilha, linha ' + first + '.' : rows.length + ' lançamentos gravados, linhas ' + first + ' a ' + lastRow + '.', undo: true };
    done(first);

    L.msg = errMsg(err, true);

function saveContas() {

async function undo() {
  const l = L.last; if (!l || L.busy || !PF.mcp) return;

    const res = await PF.mcp.callTool(PF.SERVER, READ, { spreadsheetId: PF.SHEET_ID, range }, { cache: { refresh: true } });
    const vals = (payloadOf(res) || {}).values || [];
    const same = l.rows.every((r, i) => { const x = vals[i] || []; return [1, 2, 3].every(j => PF.norm(x[j]) === PF.norm(r[j])); });
    if (!same) { L.msg = { t: 'warn', h: 'Essas linhas mudaram depois do lançamento. Para apagar, abra a linha na planilha.' }; return; }
    await PF.mcp.callTool(PF.SERVER, WRITE, { spreadsheetId: PF.SHEET_ID, range, values: l.rows.map(r => r.map(() => '')) });
    if (l.cx) { try { await cxMark(l.cx, 'novo', ''); } catch (e) { } L.cxMsg = null; }

/* ---------- gravação da renda extra ---------- */
async function nextRecRow() {
  const res = await PF.mcp.callTool(PF.SERVER, READ, { spreadsheetId: PF.SHEET_ID, range: "'RECEITAS'!A1:K" }, { cache: { refresh: true } });
  const p = payloadOf(res);
  if (!p || (p.values != null && !Array.isArray(p.values))) throw { code: 'bad_payload' };
  let last = 0;
  (p.values || []).forEach((r, i) => { if (Array.isArray(r) && r.some((c, j) => j !== 8 && j !== 9 && String(c == null ? '' : c).trim() !== '')) last = i; });
  return last + 2;
}

  const v = valOf(x.val);

  if (!x.resp) return fail('Escolha quem recebeu.');
  const iso = x.date || isoToday(), dbr = isoToBR(iso), k = idxOfIso(iso);

  const brad = x.conta === 'brad';
  const obs = 'Renda extra recebida em ' + dbr + (brad ? ' na conta Bradesco' : ' fora do Bradesco') + '. Lançada pelo painel.';
  L.busy = true; L.msg = null; PF.render();
  try {
    const row = await nextRecRow();
    await PF.mcp.callTool(PF.SERVER, WRITE, { spreadsheetId: PF.SHEET_ID, range: "'RECEITAS'!A" + row + ':H' + row, values: [[dbr, desc, x.resp, 'Outras receitas', v, 'Não', '', obs]] });
    M.rec.push({ row, desc, resp: x.resp, tipo: 'Outras receitas', val: v, repete: 'Não', obs, ini: k, fim: k, dia: null });

    }

    if (L.cxForm && L.cxForm.kind === 'extra') { const cr = L.cxForm.rows; L.cxForm = null; try { await cxMark(cr, 'lançado', 'RECEITAS linha ' + row); L.xlast.cx = cr; } catch (e3) { sx += ' Não consegui tirar a notificação da lista.'; } }
    L.msg = { t: 'good', h: '<b>+' + PF.brl(v) + '</b> de ' + esc(desc) + ' (' + esc(x.resp) + ') nas receitas de ' + PF.lab(k) + '.' + sx, xundo: true };

async function undoExtra() {
  const M = PF.M, l = L.xlast; if (!M || !l || L.busy || !PF.mcp) return;

    const res = await PF.mcp.callTool(PF.SERVER, READ, { spreadsheetId: PF.SHEET_ID, range }, { cache: { refresh: true } });
    const r = ((payloadOf(res) || {}).values || [])[0] || [];

    if (!same) { L.msg = { t: 'warn', h: 'Essa linha mudou depois do lançamento. Para apagar, abra a linha ' + l.row + ' da aba RECEITAS.' }; return; }

async function saveAdj(key, txt) {
  const M = PF.M; if (!canWrite() || C.busy) return;
  const m = S.m, cap = M.cap, cur = cap.adj.get(key + '#' + m);
  const el = document.querySelector('input[data-adj="' + (window.CSS && CSS.escape ? CSS.escape(key) : key) + '"]');
  const v0 = el ? +el.dataset.v0 : null;
  let v = txt == null ? null : valOf(txt);
  if (txt != null && v == null) { C.msg = { t: 'bad', h: 'Valor inválido. Use, por exemplo, 438,50.' }; PF.render(); return; }
  if (v != null && v0 != null && Math.abs(v - v0) < 0.005 && !cur) return;
  if (v != null && v0 != null && Math.abs(v - v0) < 0.005) v = null;
  let row = cur ? cur.row : null;
  if (v != null && row == null) {
    const used = new Set(cap.adjRows);
    for (let r = cap.adjRow0 || 70; r <= ADJ_LAST; r++) if (!used.has(r)) { row = r; break; }
    if (row == null) { C.msg = { t: 'bad', h: 'O espaço de ajustes na aba CONTAS A PAGAR está cheio. Apague linhas antigas lá.' }; PF.render(); return; }
  }

  try {
    await PF.mcp.callTool(PF.SERVER, WRITE, { spreadsheetId: PF.SHEET_ID, range: PF.CAP_SHEET + '!B' + row + ':D' + row, values: [v == null ? ['', '', ''] : [key, m, v]] });
    if (v == null) { cap.adj.delete(key + '#' + m); cap.adjRows = cap.adjRows.filter(r => r !== row); }
    else { cap.adj.set(key + '#' + m, { v, row }); if (cap.adjRows.indexOf(row) < 0) cap.adjRows.push(row); }
    PF.toast(v == null ? 'Voltou ao valor da planilha' : 'Valor atualizado');

  finally { C.busy = null; refresh(); PF.render(); }
}

/* ---------- gravações do saldo previsto ---------- */
async function writeAdjRaw(key, m, v) {
  const cap = PF.M.cap, cur = cap.adj.get(key + '#' + m);
  if (v == null && !cur) return;
  let row = cur ? cur.row : null;
  if (row == null) {
    const used = new Set(cap.adjRows);
    for (let r = cap.adjRow0 || 70; r <= ADJ_LAST; r++) if (!used.has(r)) { row = r; break; }
    if (row == null) throw { code: 'tool_error', message: 'o espaço de ajustes na aba CONTAS A PAGAR está cheio' };
  }
  await PF.mcp.callTool(PF.SERVER, WRITE, { spreadsheetId: PF.SHEET_ID, range: PF.CAP_SHEET + '!B' + row + ':D' + row, values: [v == null ? ['', '', ''] : [key, m, v]] });
  if (v == null) { cap.adj.delete(key + '#' + m); cap.adjRows = cap.adjRows.filter(r => r !== row); }
  else { cap.adj.set(key + '#' + m, { v, row }); if (cap.adjRows.indexOf(row) < 0) cap.adjRows.push(row); }
}
async function bumpSaldo(delta) {
  const cap = PF.M && PF.M.cap; if (!cap || !cap.saldoSet || Math.abs(delta) < 0.005) return;
  const v = Math.round((cap.saldo + delta) * 100) / 100;
  await PF.mcp.callTool(PF.SERVER, WRITE, { spreadsheetId: PF.SHEET_ID, range: PF.CAP_SHEET + '!C5', values: [[v]] });
  cap.saldo = v;
}
function payload(res) {
  let p = res && res.payload;
  if (typeof p === 'string') { try { p = JSON.parse(p); } catch (e) { p = null; } }
  if ((!p || typeof p !== 'object') && res && Array.isArray(res.content)) { const t = res.content.find(c => c && c.type === 'text'); if (t) { try { p = JSON.parse(t.text); } catch (e) { p = null; } } }
  return p && typeof p === 'object' ? p : null;
}
async function nextRecRow() {
  const res = await PF.mcp.callTool(PF.SERVER, READ, { spreadsheetId: PF.SHEET_ID, range: "'RECEITAS'!A1:H" }, { cache: { refresh: true } });
  const p = payload(res); if (!p || (p.values != null && !Array.isArray(p.values))) throw { code: 'tool_error', message: 'resposta inesperada ao ler RECEITAS' };
  let last = 0; (p.values || []).forEach((r, i) => { if (Array.isArray(r) && r.some(c => String(c == null ? '' : c).trim() !== '')) last = i; });
  return last + 2;
}
const spVal = k => { const el = document.querySelector('input[data-sp="' + (window.CSS && CSS.escape ? CSS.escape(k) : k) + '"]'); return el ? valOf(el.value) : null; };
async function spRun(busyKey, fn) {
  if (!canWrite() || SP.busy) return;
  SP.busy = busyKey; SP.msg = null; SP.open = true; PF.render();
  try { await fn(); } catch (err) { SP.msg = errMsg(err); }
  finally { SP.busy = null; refresh(); PF.render(); }
}
function spRec(key) {
  const v = spVal(key);
  if (!(v > 0)) { SP.msg = { t: 'bad', h: 'Digite quanto entrou (ex.: 800,00).' }; PF.render(); return; }
  return spRun(key, async () => {
    const m = PF.nowIdx();
    await writeAdjRaw('ok|' + key, m, v);
    let ex = '';
    try { await bumpSaldo(v); ex = ' Saldo do Bradesco agora: ' + PF.brl(PF.M.cap.saldo) + '.'; } catch (e) { ex = ' Não consegui somar ao saldo do Bradesco; confira em Contas a pagar.'; }
    SP.last = null;
    SP.msg = { t: 'good', h: 'Recebido ' + PF.brl(v) + ' de ' + esc(key.split('|')[1] || '') + '.' + ex };
    PF.toast('Recebido');
  });
}
function spRecUndo(key) {
  const m = PF.nowIdx(), a = PF.M.cap.adj.get('ok|' + key + '#' + m); if (!a) return;
  return spRun(key, async () => {
    await writeAdjRaw('ok|' + key, m, null);
    try { await bumpSaldo(-a.v); } catch (e) { }
    SP.msg = { t: 'good', h: 'Desfeito: ' + esc(key.split('|')[1] || '') + ' voltou para a previsão.' };
  });
}
function spRcb(n) {
  const v = spVal('pes|' + n);
  if (!(v > 0)) { SP.msg = { t: 'bad', h: 'Digite quanto ' + esc(n) + ' pagou (ex.: 250,00).' }; PF.render(); return; }
  return spRun(n, async () => {
    const M = PF.M, m = PF.nowIdx(), row = await nextRecRow(), neg = M.classOf(n) === 'Negócio';
    const desc = (neg ? 'Repasse de ' : 'Reembolso de ') + n;
    await PF.mcp.callTool(PF.SERVER, WRITE, { spreadsheetId: PF.SHEET_ID, range: "'RECEITAS'!A" + row + ':H' + row, values: [[firstOf(m), desc, n, 'Reembolso recebido', v, 'Não', '', 'Recebido pelo painel em ' + brDate(new Date()) + '.']] });
    M.rec.push({ row, desc, resp: n, tipo: 'Reembolso recebido', val: v, repete: 'Não', obs: '', ini: m, fim: m, dia: null });
    M._met = new Map();
    let ex = '', bumped = false;
    try { await bumpSaldo(v); bumped = true; ex = ' Saldo do Bradesco agora: ' + PF.brl(M.cap.saldo) + '.'; } catch (e) { ex = ' Não consegui somar ao saldo do Bradesco; confira em Contas a pagar.'; }
    SP.last = { row, v, n, bumped };
    SP.msg = { t: 'good', h: 'Recebido ' + PF.brl(v) + ' de ' + esc(n) + ', gravado em RECEITAS (linha ' + row + ').' + ex, undo: true };
    PF.toast('Recebido');
  });
}
function spUndo() {
  const L = SP.last; if (!L) return;
  return spRun('@undo', async () => {
    const M = PF.M;
    await PF.mcp.callTool(PF.SERVER, WRITE, { spreadsheetId: PF.SHEET_ID, range: "'RECEITAS'!A" + L.row + ':H' + L.row, values: [['', '', '', '', '', '', '', '']] });
    M.rec = M.rec.filter(x => x.row !== L.row); M._met = new Map();
    if (L.bumped) { try { await bumpSaldo(-L.v); } catch (e) { } }
    SP.last = null;
    SP.msg = { t: 'good', h: 'Desfeito: o recebimento de ' + esc(L.n) + ' saiu de RECEITAS.' };
  });
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t || !PF.M) return;
  const a = t.dataset.act;
  if (a === 'sp-rec') spRec(t.dataset.v);
  else if (a === 'sp-rec-undo') spRecUndo(t.dataset.v);

async function tick(name, on) {
  const M = PF.M; if (!canWrite() || C.busy) return;
  const cell = PF.tickCell(M, name, S.m); if (!cell) return;
  const key = name + '|' + S.m, before = M.cap.tick.get(key) || false;
  /* quanto essa marcação muda o saldo do Bradesco (só contas deste mês em diante) */
  const it = PF.contasMes(M, S.m).items.find(x => x.name === name);
  const delta = !it || S.m < PF.nowIdx() || !M.cap.saldoSet ? 0 : (on ? -it.falta : (it.val - Math.min(it.reg, it.val)));
  C.busy = name; C.msg = null; PF.render();
  try {
    await PF.mcp.callTool(PF.SERVER, WRITE, { spreadsheetId: PF.SHEET_ID, range: cell, values: [[!!on]] });
    if (on) M.cap.tick.set(key, true); else M.cap.tick.delete(key);
    let extra = '';
    if (Math.abs(delta) > 0.005) {
      try { await bumpSaldo(delta); extra = ' Saldo do Bradesco ' + (delta < 0 ? 'baixou ' : 'voltou ') + PF.brl(Math.abs(delta)) + ': agora ' + PF.brl(M.cap.saldo) + '.'; }
      catch (e2) { extra = ' Não consegui atualizar o saldo do Bradesco; confira em Contas a pagar.'; }
    }
    C.msg = { t: 'good', h: (on ? esc(name) + ' marcada como paga em ' + PF.lab(S.m) + '.' : 'Marcação de ' + esc(name) + ' desfeita.') + extra };
    PF.toast(on ? 'Marcada como paga' : 'Marcação desfeita');
  } catch (err) {
    if (before) M.cap.tick.set(key, true); else M.cap.tick.delete(key);
    C.msg = errMsg(err);
  } finally { C.busy = null; refresh(); PF.render(); }
}
async function saveSaldo() {
  const M = PF.M; if (!canWrite() || C.busy) return;
  const el = document.getElementById('cp-saldo'), txt = el ? el.value : (C.saldoTxt || '');
  const v = valOf(txt);
  if (v == null) { C.msg = { t: 'bad', h: 'Digite o saldo (ex.: 1.250,00 ou -500).' }; PF.render(); return; }
  C.busy = '@saldo'; C.msg = null; C.saldoTxt = txt; PF.render();
  const today = new Date();
  try {
    await PF.mcp.callTool(PF.SERVER, WRITE, { spreadsheetId: PF.SHEET_ID, range: PF.CAP_SHEET + '!C5', values: [[v]] });
    await PF.mcp.callTool(PF.SERVER, WRITE, { spreadsheetId: PF.SHEET_ID, range: PF.CAP_SHEET + '!G5', values: [[brDate(today)]] });
    M.cap.saldo = v; M.cap.saldoSet = true; M.cap.saldoDate = new Date(today.getFullYear(), today.getMonth(), today.getDate());
    C.saldoTxt = null;

    try { await writeAdjRaw('@saldo', 0, M.led.reduce((a, r) => Math.max(a, r.row), 0)); } catch (e3) { }

    PF.toast('Saldo salvo');

  finally { C.busy = null; refresh(); PF.render(); }
}

document.addEventListener('click', e => {

/* ============================================================
   RECEBI: dar baixa no que a família e os negócios devolveram.

(function () {
'use strict';
const PF = window.PF, esc = PF.esc, S = PF.S;
const WRITE = 'update_values', READ = 'get_values';

const R = PF.RB = { open: null, m: null, val: '', date: '', obs: '', busy: null, msg: null, msgFor: null, last: null };

const pad = n => String(n).padStart(2, '0');
const isoToday = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const isoToBR = s => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ''); return m ? m[3] + '/' + m[2] + '/' + m[1] : ''; };
const idxOfIso = s => { const m = /^(\d{4})-(\d{2})/.exec(s || ''); return m ? (+m[1]) * 12 + (+m[2]) - 1 : null; };
const valOf = s => { const v = PF.pNum(s); return v == null ? null : Math.round(v * 100) / 100; };
const nf2 = new Intl.NumberFormat('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

function canWrite() { return PF.mode === 'live' && !!PF.mcp && !!PF.M; }
function isNeg(M, n) { return M.classOf(n) === 'Negócio'; }

/* ---------- botão na tabela ---------- */
PF.rbBtn = function (M, n, saldo) {
  if (!(saldo > 0.005)) return '';
  const busy = R.busy === n, on = R.open === n;
  return '<button type="button" class="btn sm' + (on ? ' primary' : '') + '" data-act="rb-open" data-v="' + esc(n) + '"' +
    (busy ? ' disabled' : '') + '>' + (busy ? 'Gravando…' : (on ? 'Fechar' : 'Recebi')) + '</button>';
};

/* ---------- formulário ---------- */
function msgBox() {
  const m = R.msg; if (!m) return '';
  return '<div class="lf-msg ' + m.t + '" role="' + (m.t === 'bad' ? 'alert' : 'status') + '"><span>' + m.h +
    (m.undo ? ' <button type="button" class="btn sm" data-act="rb-undo">Desfazer</button>' : '') + '</span></div>';
}
PF.rbForm = function (M, only, grp) {
  if (R.open && R.m !== S.m) { R.open = null; R.msg = null; }
  if (only && (R.open ? R.open !== only : R.msgFor !== only)) return '';
  if (grp) {
    const who = R.open || R.msgFor;
    if (!who || (isNeg(M, who) ? 'neg' : 'fam') !== grp) return '';
  }
  const n = R.open;
  if (!n) return msgBox();
  const neg = isNeg(M, n), line = PF.receberLinha(M, n, S.m), ro = !canWrite(), busy = R.busy === n;
  const dis = (ro || busy) ? ' disabled' : '';
  const di = idxOfIso(R.date);
  const other = di != null && di !== S.m
    ? '<div class="lf-msg info"><span>A baixa vai para <b>' + PF.lab(di) + '</b>, o mês da data. Você está vendo ' + PF.lab(S.m) +

    '<div class="rb-f">' +
      '<label class="rb-v"><span>Valor recebido</span><span class="rb-in"><span class="cur">R$</span>' +
        '<input id="rb-val" inputmode="decimal" value="' + esc(R.val) + '"' + dis + '></input></span></label>' +
      '<label><span>Data</span><input id="rb-date" type="date" value="' + esc(R.date) + '"' + dis + '></label>' +
      '<label class="rb-o"><span>Observação <small class="muted">(opcional)</small></span><input id="rb-obs" value="' + esc(R.obs) + '" placeholder="Ex.: pix do dia 12"' + dis + '></label>' +
    '</div>' +
    '<div class="rb-btns">' +
      '<button type="button" class="btn primary" data-act="rb-save"' + dis + '>' + (busy ? 'Gravando…' : 'Confirmar') + '</button>' +
      '<button type="button" class="btn" data-act="rb-cancel"' + (busy ? ' disabled' : '') + '>Cancelar</button>' +
      (line.saldo > 0.005 && !ro ? '<button type="button" class="btn sm" data-act="rb-all"' + dis + '>Recebi tudo (' + PF.brl(line.saldo) + ')</button>' : '') +
    '</div>' +

    '<p class="lf-help">Entra na aba RECEITAS como <b>' + TIPO + '</b>, no nome de ' + esc(n) + '. O saldo dele diminui na hora. Se sobrar valor, continua em aberto no mês seguinte.</p>' +
  '</section>';

/* ---------- gravação ---------- */
function payloadOf(res) {
  let p = res && (res.payload != null ? res.payload : res);
  if ((!p || typeof p !== 'object') && res && Array.isArray(res.content)) {
    const t = res.content.find(c => c && c.type === 'text');
    if (t) { try { p = JSON.parse(t.text); } catch (e) { p = null; } }
  }
  return p && typeof p === 'object' ? p : null;
}
async function nextRow() {
  const res = await PF.mcp.callTool(PF.SERVER, READ, { spreadsheetId: PF.SHEET_ID, range: REC_SHEET + '!A1:K' }, { cache: { refresh: true } });
  const p = payloadOf(res);
  if (!p || (p.values != null && !Array.isArray(p.values))) throw { code: 'bad_payload' };
  const vals = p.values || [];
  let last = 0;
  // colunas I e J são ARRAYFORMULA: não contam como linha preenchida
  vals.forEach((r, i) => {
    if (!Array.isArray(r)) return;

function errMsg(err) {

    not_in_manifest: 'O painel está sem permissão para gravar no Google Sheets. Permita no menu de permissões da página e tente de novo.',
    consent_required: 'Falta a sua permissão para o painel gravar no Google Sheets. Tente de novo e permita.',
    approval_required: 'O Google Sheets pediu a sua aprovação e ela não chegou. Tente de novo e aprove.',
    needs_reauth: 'A conexão com o Google Sheets expirou. Reconecte em Configurações > Conectores no claude.ai.',
    server_not_connected: 'O conector Google Sheets não está ligado. Adicione em Configurações > Conectores no claude.ai.',
    blocked_by_policy: 'A política da sua organização bloqueia a gravação no Google Sheets.',
    tool_error: 'A planilha recusou a gravação: ' + esc(err && err.message ? err.message : 'sem detalhe') + '.',
    full: 'A aba RECEITAS chegou na última linha (' + MAXROW + '). É preciso aumentar o limite da planilha.',
    bad_payload: 'O Google Sheets respondeu de um jeito inesperado. Nada foi gravado.'

  if (['server_unavailable', 'upstream_error', 'cancelled', 'rate_limited'].indexOf(c) >= 0)

}
function refresh() { if (PF.mcp) Promise.resolve(PF.mcp.invalidate(PF.SERVER, READ)).catch(() => { }); }

/* abate local, para o saldo cair na hora */
function addLocal(M, row, n, v, ini, obs, desc) {
  M.rec.push({ row, desc, resp: n, tipo: TIPO, val: v, repete: 'Não', obs, ini, fim: ini, dia: null });
  M._met = new Map();
}
function dropLocal(M, row) {
  M.rec = M.rec.filter(x => x.row !== row);
  M._met = new Map();
}

function open(n) {
  const M = PF.M; if (!M) return;
  if (R.open === n) { R.open = null; R.msg = null; PF.render(); return; }
  const line = PF.receberLinha(M, n, S.m);
  R.open = n; R.m = S.m; R.val = nf2.format(Math.max(0, line.saldo)); R.date = isoToday(); R.obs = ''; R.msg = null; R.msgFor = n;
  PF.render();
  setTimeout(() => {
    const el = document.getElementById('rb-val'); if (!el) return;
    const box = el.closest('.panel.rb');
    if (box && box.scrollIntoView) { try { box.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (e) { box.scrollIntoView(); } }
    try { el.focus({ preventScroll: true }); el.select(); } catch (e) { }
  }, 40);
}
function readForm() {
  const g = id => { const el = document.getElementById(id); return el ? el.value : null; };
  const v = g('rb-val'); if (v != null) R.val = v;
  const d = g('rb-date'); if (d != null) R.date = d;
  const o = g('rb-obs'); if (o != null) R.obs = o;
}
async function save() {
  const M = PF.M, n = R.open;
  if (!M || !n || R.busy) return;
  readForm();
  const fail = h => { R.msg = { t: 'bad', h }; R.msgFor = n; PF.render(); };
  if (!canWrite()) return fail(PF.mode === 'live' ? 'O painel não conseguiu permissão para gravar na planilha.' : 'Nos dados de exemplo nada é gravado.');
  const v = valOf(R.val);
  if (v == null || v <= 0) return fail('Digite o valor recebido (ex.: 270,18).');
  const dbr = isoToBR(R.date || isoToday()), ini = idxOfIso(R.date || isoToday());
  if (!dbr || ini == null) return fail('Data inválida.');
  if (!M.respMap.has(n)) return fail(esc(n) + ' não está em CADASTROS.');
  const neg = isNeg(M, n), line = PF.receberLinha(M, n, S.m);
  const desc = (neg ? 'Repasse de ' : 'Reembolso de ') + n;
  const obs = (R.obs || '').trim() || 'Baixa pelo painel. Em aberto antes: ' + PF.brl(line.saldo) + '.';
  R.busy = n; R.msg = null; R.msgFor = n; PF.render();
  let row = null;
  try {
    row = await nextRow();
    if (row > MAXROW) throw { code: 'full' };
    // I e J são ARRAYFORMULA: grava só A:H
    await PF.mcp.callTool(PF.SERVER, WRITE, {
      spreadsheetId: PF.SHEET_ID, range: REC_SHEET + '!A' + row + ':H' + row,
      values: [[dbr, desc, n, TIPO, v, 'Não', '', obs]]

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t || !PF.M) return;
  const a = t.dataset.act;

  else if (a === 'rb-save') save();
  else if (a === 'rb-cancel') { readForm(); R.open = null; R.msg = null; PF.render(); }
  else if (a === 'rb-undo') undo();
  else if (a === 'rb-goto') { readForm(); const k = +t.dataset.v; R.m = k; PF.setMonth(k); }

  const nome = PF.MESL[PF.moOf(S.m)], Nome = nome.charAt(0).toUpperCase() + nome.slice(1) + '/' + String(PF.yOf(S.m)).slice(2);
  const nx = nextOpen(M, S.m), nxLab = nx != null ? PF.MESL[PF.moOf(nx)].charAt(0).toUpperCase() + PF.MESL[PF.moOf(nx)].slice(1) + '/' + String(PF.yOf(nx)).slice(2) : null;
  const go = nx != null ? '<button type="button" class="btn primary" data-act="fin-go" data-v="' + nx + '">Ir para ' + esc(nxLab) + ' →</button>' : '';
  if (PF.FIN_OK.has(S.m)) return '<div class="fin mini" role="note"><span class="ic-l">' + LOCK + '</span><span class="tx">' + esc(Nome) + ' finalizado em ' + esc(CI.date.slice(0, 5)) + ': você está vendo um mês encerrado.</span><div class="acts">' + go.replace('class="btn primary"', 'class="btn sm primary"') + '</div></div>';
  return '<section class="fin" role="alert" aria-label="Mês finalizado"><span class="ic-l">' + LOCK + '</span><div class="tx"><h2>' + esc(Nome) + ' já foi finalizado</h2>' +
    '<p>Fechado em ' + esc(CI.date) + (CI.saldo != null ? ', com ' + esc(PF.brl(CI.saldo)) + ' no Bradesco' : '') + '. Os números deste mês não mudam mais. ' + (nxLab ? 'Para acompanhar o mês em andamento, vá para <b>' + esc(nxLab) + '</b>.' : '') + '</p></div>' +
    '<div class="acts">' + go + '<button type="button" class="btn" data-act="fin-ok">Ver ' + esc(nome) + ' mesmo assim</button></div></section>';
}

/* ---------- aviso de compras novas vindas das notificações ---------- */
function cxBar() {
  const M = PF.M; if (!M || PF.mode !== 'live' || S.tab === 'lancar') return '';
  const n = PF.cxGroups(M).length; if (!n) return '';
  return '<div class="cxbar" role="status"><span class="tx"><b>' + n + (n === 1 ? ' compra nova chegou' : ' compras novas chegaram') + '</b> das notificações do celular.</span><button type="button" class="btn sm primary" data-tab="lancar">Revisar e lançar</button></div>';
}

/* ---------- desenho ---------- */
function skeleton() {
  const k = '<div class="kpi"><div class="sk" style="height:10px;width:55%"></div><div class="sk" style="height:26px;width:70%"></div><div class="sk" style="height:12px;width:90%"></div></div>';
  return '<div class="kpis">' + new Array(8).fill(k).join('') + '</div><div class="grid gw"><div class="panel"><div class="sk" style="height:270px"></div></div><div class="panel"><div class="sk" style="height:270px"></div></div></div>';
}
function updateBadge() {
  const b = $('pendBadge');
  if (b) { const n = PF.M ? PF.pendencias(PF.M).total : 0; b.hidden = !n; b.textContent = n; }
  const c = $('cxBadge');
  if (c) { const k = PF.M && PF.mode === 'live' ? PF.cxGroups(PF.M).length : 0; c.hidden = !k; c.textContent = k; }
}
function setLive(state, txt) { const l = $('live'); l.dataset.s = state; $('liveTxt').textContent = txt; }
function hhmm(ts) { const d = new Date(ts); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }
function updateFoot() {
  const M = PF.M; if (!M) { $('foot').innerHTML = ''; return; }
  const ts = Object.keys(PF.ts).length ? Math.max.apply(null, Object.values(PF.ts)) : null;
  $('foot').innerHTML = '<span>' + (PF.mode === 'demo' ? 'Dados de exemplo, fictícios.' : 'Fonte: planilha CONTROLE FINANCEIRO 2026' + (ts ? ' · lida às ' + hhmm(ts) : '')) + '</span><span>' + M.led.length + ' lançamentos · ' + M.rec.length + ' receitas</span>' + (PF.mode === 'demo' ? '' : '<a href="' + PF.SHEET_URL + '" target="_blank" rel="noopener">Abrir a planilha ↗</a>');
}
PF.render = function (o) {
  o = o || {};
  const view = $('view');
  PF.readTheme(); PF.killCharts();
  document.querySelectorAll('#nav button, #tabbar button').forEach(b => b.setAttribute('aria-current', b.dataset.tab === S.tab ? 'page' : 'false'));
  document.body.dataset.tela = S.tab;
  $('mnav').style.display = (!PF.M || S.tab === 'pendencias' || S.tab === 'lancar') ? 'none' : '';
  if (!PF.M) {
    view.innerHTML = PF.mode === 'error' ? '<div class="panel">' + PF.empty('Os números ainda não chegaram', 'Resolva o aviso acima para ler a planilha, ou veja a página com dados de exemplo.') + '</div>' : skeleton();
    $('vTitle').textContent = TABS[S.tab] || ''; $('vSub').innerHTML = '&nbsp;'; return;
  }
  const fn = V[S.tab] || V.mes;
  let out;
  try { out = fn(PF.M); } catch (e) {
    console.error(e);
    out = { title: TABS[S.tab], sub: '', html: '<div class="panel">' + PF.empty('Não foi possível montar esta tela', esc(String(e && e.message || e))) + '</div>' };
  }
  const y = window.scrollY;
  view.innerHTML = out.html;
  $('vTitle').textContent = out.title; $('vSub').textContent = (PF.mode === 'demo' ? 'EXEMPLO · ' : '') + (out.sub || '');
  fillMonthSelect(); updateBadge(); updateFoot();
  if (out.after) { try { out.after(); } catch (e) { console.error(e); } }
  if (o.top) window.scrollTo(0, 0); else window.scrollTo(0, y);
};

/* ---------- avisos ---------- */
function banner(kind, html) { $('banner').innerHTML = html ? '<div class="banner ' + kind + '">' + html + '</div>' : ''; }
const AUTHZ = ['needs_reauth', 'server_not_connected', 'selection_required', 'server_not_found', 'blocked_by_policy', 'approval_required', 'not_in_manifest', 'not_granted', 'capability_disabled', 'capability_removed', 'consent_required'];
function errorBanner(err) {
  const c = err && err.code, btnDemo = '<span class="sp"></span><button type="button" class="btn sm" data-act="demo">Ver exemplo</button>';
  const retry = '<button type="button" class="btn sm primary" data-act="retry">Tentar de novo</button>';
  const t = {
    needs_reauth: '<b>A conexão com o Google Sheets expirou.</b> Reconecte em Configurações > Conectores no claude.ai e recarregue esta página.',
    server_not_connected: '<b>O conector Google Sheets não está ligado.</b> Adicione em Configurações > Conectores no claude.ai e recarregue esta página.',
    selection_required: '<b>Há mais de um conector Google Sheets.</b> Escolha qual usar quando o aviso aparecer.',
    server_not_found: '<b>O conector Google Sheets não foi encontrado.</b> Adicione em Configurações > Conectores no claude.ai.',
    blocked_by_policy: '<b>A política da sua organização bloqueia a leitura do Google Sheets</b> nesta página.',
    approval_required: '<b>O Google Sheets pede a sua aprovação</b> para ler a planilha.',
    not_in_manifest: '<b>Esta página está sem permissão para ler o Google Sheets.</b> O acesso foi recusado ou desativado. Permita no menu de permissões da página e tente de novo.',
    consent_required: '<b>Falta a sua permissão para ler o Google Sheets.</b> Permita e tente de novo.',
    server_unavailable: '<b>O Google Sheets não respondeu agora.</b> Vamos tentar de novo em instantes.',
    upstream_error: '<b>O Google Sheets não respondeu agora.</b> Vamos tentar de novo em instantes.',
    rate_limited: '<b>Muitas leituras seguidas.</b> Aguarde alguns segundos.',
    tool_error: '<b>O Google Sheets recusou a leitura.</b> ' + esc(err && err.message ? err.message : '') + ' Confira se esta conta tem acesso à planilha.'
  };
  const msg = t[c] || ('<b>Não foi possível ler a planilha</b> (' + esc(c || 'erro') + ').');
  const action = c === 'approval_required' ? '<button type="button" class="btn sm primary" data-act="approve">Aprovar leitura</button>' : retry;
  banner('bad', msg + '<span class="sp"></span>' + action + '<button type="button" class="btn sm" data-act="demo">Ver exemplo</button>');
}

/* ---------- dados ao vivo ---------- */
function payloadOf(res) {
  let p = res && res.payload;
  if (typeof p === 'string') { try { p = JSON.parse(p); } catch (e) { p = null; } }
  if ((!p || typeof p !== 'object') && res && Array.isArray(res.content)) {
    const t = res.content.find(c => c && c.type === 'text');
    if (t) { try { p = JSON.parse(t.text); } catch (e) { p = null; } }
  }
  if (p && typeof p === 'object') { if (Array.isArray(p)) return { values: p }; if (Array.isArray(p.values)) return p; if ('range' in p || 'majorDimension' in p) return { values: [] }; }
  return null;
}
let tApply = null;
function schedule() { clearTimeout(tApply); tApply = setTimeout(apply, 80); }
function onEvent(k, ev) {
  if (ev.type === 'data') {
    const p = payloadOf(ev.result);
    if (!p) { PF.errs[k] = { code: 'bad_payload', message: 'Resposta inesperada do Google Sheets.' }; schedule(); return; }
    PF.raw[k] = p; delete PF.errs[k];
    PF.ts[k] = ev.result && ev.result.cache && ev.result.cache.storedAt ? ev.result.cache.storedAt : Date.now();
  } else { PF.errs[k] = ev.error || { code: 'upstream_error' }; }
  schedule();
}
function apply() {
  const need = PF.REQUIRED, have = need.every(k => PF.raw[k]);
  const errNeed = need.map(k => PF.errs[k]).filter(Boolean)[0];
  if (errNeed && AUTHZ.indexOf(errNeed.code) >= 0) {
    if (['not_granted', 'capability_disabled', 'capability_removed'].indexOf(errNeed.code) >= 0) { startDemo('Esta visualização não tem acesso ao Google Sheets.'); return; }
    PF.raw = {}; PF.ts = {};
    if (PF.mode === 'live' || PF.mode === 'loading') { PF.M = null; PF.mode = 'error'; }
    setLive('error', 'Sem acesso à planilha');
    errorBanner(errNeed);
    if (!PF.M) PF.render();
    return;
  }
  if (!have) {
    if (errNeed) { if (PF.mode === 'loading') { PF.mode = 'error'; PF.render(); } setLive('error', 'Planilha não respondeu'); errorBanner(errNeed); }
    return;
  }
  const wasLive = PF.mode === 'live';
  PF.M = PF.build(PF.raw); PF.mode = 'live';
  if (!wasLive || S.m == null) S.m = defaultMonth();
  setLive('live', 'Ao vivo · lida às ' + hhmm(Math.max.apply(null, Object.values(PF.ts))));
  if (errNeed) banner('warn', '<b>Não foi possível atualizar agora.</b> Mostrando a última leitura. ' + (errNeed.message ? esc(errNeed.message) : '')); else banner('', '');
  PF.render();
}
function connect() {
  if (!PF.mcp) return;
  PF.unsubs.forEach(u => { try { u(); } catch (e) { } }); PF.unsubs = [];
  PF.errs = {};
  if (PF.mode === 'loading' || PF.mode === 'error') setLive('loading', 'Aguardando a planilha…');
  Object.keys(PF.RANGES).forEach(k => {
    try {
      PF.unsubs.push(PF.mcp.watchTool(PF.SERVER, PF.TOOL, { spreadsheetId: PF.SHEET_ID, range: PF.RANGES[k] }, ev => onEvent(k, ev), { refetchInterval: 90000 }));
    } catch (e) { PF.errs[k] = { code: 'bad_request', message: String(e && e.message || e) }; }
  });
  schedule();
}
function startDemo(reason) {
  PF.mode = 'demo';
  PF.M = PF.build(PF.demoRaw()); S.m = defaultMonth(); S.filter = null; S.resps = null; S.unit = 'Todas';
  setLive('demo', 'Exemplo com dados fictícios');
  banner('info', '<b>Você está vendo dados de exemplo (fictícios).</b> ' + esc(reason || '') + (PF.mcp ? '<span class="sp"></span><button type="button" class="btn sm primary" data-act="retry">Conectar à planilha</button>' : ''));
  PF.render();
}
PF.refreshLive = function () {
  const b = $('btnRefresh');
  if (PF.mode !== 'live' || !PF.mcp) { if (PF.mode === 'demo') { PF.toast('Dados de exemplo: não há o que atualizar.'); } else if (PF.mcp) { connect(); } return; }
  b.classList.add('spin');
  Promise.resolve(PF.mcp.invalidate(PF.SERVER, PF.TOOL)).catch(() => { }).then(() => setTimeout(() => b.classList.remove('spin'), 1400));
};

/* ---------- navegação e eventos ---------- */
function go(tab) {
  if (!TABS[tab]) tab = OLD_TAB[tab] || 'mes';
  S.tab = tab; S.filter = null; S.lf = {}; S.q = ''; save();
  try { history.replaceState(null, '', '#' + tab); } catch (e) { }
  PF.render({ top: true });
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act],[data-tab]'); if (!t) return;
  if (t.dataset.tab) { go(t.dataset.tab); return; }
  const a = t.dataset.act, v = t.dataset.v;
  switch (a) {
    case 'tab': go(v); break;
    case 'scope': S.scope = v; S.filter = null; S.limit = 60; save(); PF.render(); break;
    case 'grp': S.grpBy = v; S.filter = null; save(); PF.render(); break;
    case 'ledby': S.ledBy = v; S.limit = 60; save(); PF.render(); break;
    case 'mesdim': S.mesDim = v; PF.render(); break;
    case 'ledsort': S.sort.led = { k: v, d: -1 }; S.limit = 60; PF.render(); break;
    case 'f-resp': case 'f-card': case 'f-grupo': case 'f-cat': {
      const k = a.slice(2); S.filter = (S.filter && S.filter.k === k && S.filter.v === v) ? null : { k, v }; S.limit = 60; PF.render();
      if (S.filter) { const el = $('ledPanel'); if (el && el.scrollIntoView) el.scrollIntoView({ block: 'start', behavior: 'smooth' }); }
      break;
    }
    case 'clearf': S.filter = null; PF.render(); break;
    case 'fin-go': PF.setMonth(+v); window.scrollTo(0, 0); break;
    case 'fin-ok': PF.FIN_OK.add(S.m); PF.render(); break;
    case 'led-clear': S.filter = null; S.q = ''; S.lf = {}; S.limit = 60; PF.render(); break;
    case 'sort': {
      const key = t.dataset.t === 'parcTbl' ? 'parc' : t.dataset.t, dflt = key === 'led' ? { k: 'val', d: -1 } : { k: 'falta', d: -1 };
      const cur = S.sort[key] || dflt;
      S.sort[key] = cur.k === v ? { k: v, d: -cur.d } : { k: v, d: ['desc', 'resp', 'card', 'cat', 'tipo', 'fim'].indexOf(v) >= 0 ? 1 : -1 };
      PF.render(); break;
    }
    case 'more': S.limit += 60; PF.refreshLed(); break;
    case 'year': PF.setMonth(PF.idxOf(+v, PF.moOf(S.m))); break;
    case 'dim': S.dim = v; save(); PF.render(); break;
    case 'resp': { const cur = (S.resps || []).slice(), i = cur.indexOf(v); if (i >= 0) { if (cur.length > 1) cur.splice(i, 1); } else cur.push(v); S.resps = cur; save(); PF.render(); break; }
    case 'resp-set': S.resps = String(v || '').split('|').filter(Boolean); save(); PF.render(); break;
    case 'unit': S.unit = v; PF.render(); break;
    case 'pscope': S.parcScope = v; PF.render(); break;
    case 'ptype': S.pendType = v; PF.render(); break;
    case 'statement': S.resps = [v]; save(); go('pessoas'); break;
    case 'copystmt': { const ta = $('stmtTxt'); if (ta) PF.copyText(ta.value, ta); break; }
    case 'goto': S.tab = 'mes'; save(); PF.setMonth(+v); window.scrollTo(0, 0); break;
    case 'demo': startDemo('Os números reais aparecem quando a planilha conectar.'); break;
    case 'retry': banner('', ''); connect(); break;
    case 'approve': {
      if (!PF.mcp) break;
      Promise.resolve(PF.mcp.callTool(PF.SERVER, PF.TOOL, { spreadsheetId: PF.SHEET_ID, range: PF.RANGES.cad })).then(() => { banner('', ''); connect(); }).catch(err => { PF.errs.cad = err; schedule(); });
      break;
    }
  }
});
document.addEventListener('input', e => { if (e.target && e.target.id === 'ledQ') { S.q = e.target.value; S.limit = 60; PF.refreshLed(); } });
document.addEventListener('change', e => {
  const el = e.target; if (!el || !el.classList || !el.classList.contains('led-f')) return;
  S.lf = S.lf || {}; S.lf[el.dataset.k] = el.value; S.limit = 60; PF.render();
});
$('mSel').addEventListener('change', e => PF.setMonth(+e.target.value));
$('mPrev').addEventListener('click', () => PF.setMonth(S.m - 1));
$('mNext').addEventListener('click', () => PF.setMonth(S.m + 1));
$('btnRefresh').addEventListener('click', () => PF.refreshLive());
$('sheetLink').setAttribute('href', PF.SHEET_URL);

/* ---------- tema do viewer ---------- */
let rq = null;
function rerender() { if (rq) return; rq = requestAnimationFrame(() => { rq = null; if (PF.M) PF.render(); }); }
try { const mq = matchMedia('(prefers-color-scheme: dark)'); (mq.addEventListener ? mq.addEventListener('change', rerender) : mq.addListener(rerender)); } catch (e) { }
try { new MutationObserver(rerender).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] }); } catch (e) { }

/* ---------- partida ---------- */
PF.boot = async function () {
  restore();
  PF.render();
  const timer = setTimeout(() => { if (PF.mode === 'loading') startDemo('Conectando à planilha…'); }, 1400);
  let mcp = null;
  try { mcp = window.claude && window.claude.use ? await window.claude.use('mcp') : null; } catch (e) { mcp = null; }
  clearTimeout(timer);
  if (!mcp) { if (PF.mode !== 'live') startDemo('Esta visualização não está ligada ao Google Sheets.'); return; }
  PF.mcp = mcp;
  if (PF.mode === 'demo') banner('info', '<b>Dados de exemplo (fictícios) por enquanto.</b> Conectando à planilha…');
  connect();
};
PF.boot();
})();

</script>
